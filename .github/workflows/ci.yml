name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # Plays LibriSpeech clips through a mock microphone into the real pipeline (Silero VAD, Qwen3-ASR,
  # the uncertainty check) and checks the typed text against the transcripts.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The models and ONNX Runtime, about 1 GB, change only when the scripts pin new ones. They
      # live outside target/ so the Rust cache does not carry them too.
      - uses: actions/cache@v4
        with:
          path: ~/e2e
          key: e2e-${{ runner.os }}-${{ hashFiles('scripts/e2e.sh', 'scripts/fetch-models.sh') }}
      - run: sh scripts/e2e.sh ~/e2e
