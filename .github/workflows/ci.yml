name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # Plays LibriSpeech clips through a mock microphone into the real pipeline (Silero VAD, Qwen3-ASR,
  # the uncertainty check) and checks the typed text against the transcripts. It then packages the
  # `md` CLI, and on macOS the app, from the same release build and uploads them as the run's
  # artifacts, so every pull request can be tried without publishing a release.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The models and ONNX Runtime, about 1 GB, change only when the scripts pin new ones. They
      # live outside target/ so the Rust cache does not carry them too.
      - uses: actions/cache@v4
        with:
          path: ~/e2e
          key: e2e-${{ runner.os }}-${{ hashFiles('scripts/e2e.sh', 'scripts/fetch-models.sh') }}
      - run: sh scripts/e2e.sh ~/e2e
      # Packaged even when the e2e test fails, so a failing build can still be tried by hand.
      - name: Package the CLI
        if: ${{ !cancelled() }}
        run: |
          cargo build --release --locked -p mini-dictator-cli
          sh scripts/package-cli.sh ${{ matrix.platform }}
      # ditto keeps the bundle's symlinks and signature intact, unlike zip.
      - name: Package the app
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          sh scripts/bundle-macos.sh
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/macos/Cargo.toml)
          ditto -c -k --keepParent "target/release/Mini Dictator.app" \
            "target/dist/Mini-Dictator-$version-macos-arm64.zip"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: target/dist/*
          if-no-files-found: error

  # Times the recognizer on the e2e clips, for this commit and the pull request's base on the same
  # runner. Shared runners are noisy, so it only hints at large changes; it never fails the build.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/e2e
          key: e2e-${{ runner.os }}-${{ hashFiles('scripts/e2e.sh', 'scripts/fetch-models.sh') }}
      - run: sh scripts/bench.sh ~/e2e ${{ github.event.pull_request.base.sha }}
      - run: cat target/bench/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: target/bench/*.json

  # Reads a page in Chrome through the accessibility API with the app's own reader.
  accessibility:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/accessibility-e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-screen
          path: target/accessibility
          if-no-files-found: ignore
