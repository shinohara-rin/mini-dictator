name: Release

# Push a tag such as v0.2.0 to build every artifact and publish them as a GitHub Release; a tag
# with a hyphen (v0.2.0-rc.1) becomes a prerelease. Running it by hand with a tag does the same,
# creating the tag at the commit it runs on; without a tag it builds the artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, such as v0.2.0 (leave empty to only build)
        required: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read

jobs:
  # Checks the tag before anything is built: a version-shaped name, and, when the tag already
  # exists, that it points at the commit being built.
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$TAG" ] || exit 0
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a version tag such as v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $tagged, not the commit being built ($GITHUB_SHA). Run the workflow on $TAG instead."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  cli:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: osx-arm64
          - os: windows-latest
            platform: win-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mini-dictator-cli
      - run: sh scripts/package-cli.sh ${{ matrix.platform }} "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: md-${{ matrix.platform }}
          path: target/dist/*
          if-no-files-found: error

  macos-app:
    needs: tag
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/bundle-macos.sh "$VERSION"
      # ditto keeps the bundle's symlinks and signature intact, unlike zip.
      - name: Package
        run: |
          version=${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' crates/macos/Cargo.toml)}
          mkdir -p target/dist
          ditto -c -k --keepParent "target/release/Mini Dictator.app" \
            "target/dist/Mini-Dictator-$version-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: target/dist/*
          if-no-files-found: error

  release:
    if: needs.tag.outputs.version != ''
    needs: [tag, cli, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            The builds are not signed or notarized yet. On macOS, unzip the app, move it to
            Applications, and run `xattr -dr com.apple.quarantine "/Applications/Mini Dictator.app"`
            before the first launch; the `md` CLI needs the same for its folder. Models are not
            included: see `scripts/fetch-models.sh`.

            Each `md` archive carries ONNX Runtime beside the binary, so `--ort` is not needed.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A release made on github.com first: attach the artifacts to it.
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          prerelease=
          case $TAG in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --generate-notes $prerelease --notes "$NOTES"
