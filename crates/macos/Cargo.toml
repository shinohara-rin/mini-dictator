[package]
name = "mini-dictator-macos"
version = "0.1.0"
description = "The macOS tray shell of Mini Dictator"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mini-dictator"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
mini-dictator-core = { workspace = true, features = ["onnx", "http"] }
serde.workspace = true
toml = "1"
tao = "0.37"
tray-icon = "0.26"
global-hotkey = "0.8"
cpal = "0.18"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSSound"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFArray", "CFDictionary", "CFNumber", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource"] }
objc2-application-services = { version = "0.3", features = ["HIServices", "AXUIElement", "AXError", "AXValue", "libc"] }
libc = "0.2"
