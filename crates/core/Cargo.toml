[package]
name = "mini-dictator-core"
version = "0.1.0"
description = "Platform-independent dictation core: VAD gating, transducer ASR, hotword biasing, uncertainty, and LLM rewrite"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Runs sherpa-onnx transducer models and Silero VAD through ONNX Runtime, loaded at run time.
onnx = ["dep:ort"]
# Rewrites transcripts with an OpenAI-compatible chat completions endpoint.
http = ["dep:ureq", "dep:serde", "dep:serde_json"]

[dependencies]
thiserror.workspace = true
ort = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
